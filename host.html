<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Super Party all-in-one</title>
    <link rel="stylesheet" href="/css/host.css">
</head>
<body>

    <div id="overlay-flash"></div>
    <div id="letsgo-sign"><img src="/img/letsgo.png" alt="LET'S GO!"></div>

    <div id="pantalla-bienvenida">
        <img src="img/super-party-intro.png" alt="intro" id="bienvenida-bg">
        <div id="bienvenida-capa"></div>
        <div id="bienvenida-texto">Presiona cualquier botón</div>
    </div>

    <div id="pantalla-inicio">
        <div id="lobby-personajes"></div>
        <img src="img/super_party_logo.png" alt="Super Party all-in-one" id="titulo-lobby">
        
        <div id="lobby-layout">
            <div id="lobby-left">
                <div id="lobby-qr-card" class="lobby-card">
                    <p id="lobby-qr-title">Escanea para jugar</p>
                    <div id="qr-inicio" class="qr-box" title="QR para unirse con el móvil"></div>
                    <p id="qr-inicio-url"></p>
                    <div id="lobby-btn-grid" class="vol-ctrl">
                        <button id="btn-vol-off" class="px-btn"><img src="img/btn_vol_off.png" width="52" alt=""></button>
                        <button id="btn-vol-on" class="px-btn"><img src="img/btn_vol_on.png" width="52" alt=""></button>
                    </div>
                    <input id="vol-slider-lobby" type="range" min="0" max="1" step="0.05" value="0.5">
                </div>
            </div>

            <div id="lobby-center">
                <div id="game-selector">
                    <button id="btn-prev-game" class="px-btn"><img src="img/btn_prev.png" alt=""></button>
                    <div id="cartridge-display"><img id="cartridge-img" src="" alt="Juego"></div>
                    <button id="btn-next-game" class="px-btn"><img src="img/btn_next.png" alt=""></button>
                </div>
                <div id="game-name"></div>
                <button id="btn-iniciar"><img src="img/btn_iniciar.png" alt="INICIAR JUEGO"></button>
            </div>

            <div id="lobby-right">
                <div id="lobby-players-card" class="lobby-card">
                    <p id="lobby-players-title">Jugadores conectados:</p>
                    <div id="lobby-lista-jugadores"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="contenedor-pista-hielo"></div>
    
   
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="/vendor/qrcode.min.js"></script>
    <script type="module" src="/js/host/main.js"></script>
</body>
</html>
